name: Compliance eval (live LLM runs)

# Runs the compliance agent and/or the fixed-pipeline baseline over the labelled clause
# set with a real LLM, then commits predictions, run records and every LLM response
# (data/eval/compliance/llm_cache) to the branch it ran on. compliance-ci.yml replays
# those responses on every push without calling a provider.
#
# Runs resume: a run stopped by a quota limit keeps its predictions and the next dispatch
# continues from them (and from cached responses). Set `fresh` to start over after changing the agent.
#
# Two ways to start a run: workflow_dispatch (once this file is on the default branch),
# or pushing a change to .github/compliance-eval-request.json on any branch (same fields
# as the dispatch inputs), so a run can be requested from a feature branch too.

on:
  push:
    paths:
      - .github/compliance-eval-request.json
  workflow_dispatch:
    inputs:
      systems:
        description: "Systems to run, comma-separated (agent, baseline)"
        type: string
        default: "agent,baseline"
      split:
        description: "Split (dev for development; test only for the locked final run)"
        type: choice
        options: [dev, test]
        default: dev
      backend:
        description: "LLM backend"
        type: choice
        options: [gemini, groq]  # free tiers only
        default: gemini
      model:
        description: "Model id (empty = the backend's default)"
        type: string
        default: ""
      limit:
        description: "Only the first N clauses (empty = all)"
        type: string
        default: ""
      abstain_threshold:
        description: "Confidence below which substantive verdicts abstain"
        type: string
        default: "0.0"
      cache_mode:
        description: "use = reuse recorded responses; refresh = call the provider again"
        type: choice
        options: [use, refresh]
        default: use
      fallbacks:
        description: "auto = the provider's other models when the configured one is rate-limited; none = one model only"
        type: choice
        options: [auto, none]
        default: auto
      fresh:
        description: "Start over (ignore earlier predictions) instead of resuming; use after changing the agent"
        type: boolean
        default: false

permissions:
  contents: write  # commit predictions and recorded responses back to the branch

concurrency:
  group: compliance-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RBIRAG_EMBEDDER: fake  # the agent searches with BM25 (chosen on dev); no embedding model
  RBIRAG_RERANKER: none
  RBIRAG_COMPLIANCE_LLM_CACHE_DIR: data/eval/compliance/llm_cache

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs (dispatch inputs, or the committed request file)
        id: in
        env:
          EVENT: ${{ github.event_name }}
          D_SYSTEMS: ${{ inputs.systems }}
          D_SPLIT: ${{ inputs.split }}
          D_BACKEND: ${{ inputs.backend }}
          D_MODEL: ${{ inputs.model }}
          D_LIMIT: ${{ inputs.limit }}
          D_THRESHOLD: ${{ inputs.abstain_threshold }}
          D_CACHE: ${{ inputs.cache_mode }}
          D_FRESH: ${{ inputs.fresh }}
          D_FALLBACKS: ${{ inputs.fallbacks }}
        run: |
          python3 - <<'PY'
          import json, os
          if os.environ["EVENT"] == "workflow_dispatch":
              v = {k: os.environ[f"D_{k.upper()}"] for k in ("systems", "split", "backend", "model", "limit", "threshold", "cache", "fresh", "fallbacks")}
          else:
              req = json.load(open(".github/compliance-eval-request.json"))
              v = {
                  "systems": req.get("systems", "agent,baseline"), "split": req.get("split", "dev"),
                  "backend": req.get("backend", "gemini"), "model": req.get("model", ""),
                  "limit": str(req.get("limit", "") or ""), "threshold": str(req.get("abstain_threshold", "0.0")),
                  "cache": req.get("cache_mode", "use"),
                  "fresh": str(req.get("fresh", False)).lower(),
                  "fallbacks": req.get("fallbacks", "auto"),
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, val in v.items():
                  fh.write(f"{k}={val}\n")
          print(json.dumps(v))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm,eval]"

      - name: Validate inputs
        env:
          SYSTEMS: ${{ steps.in.outputs.systems }}
          SPLIT: ${{ steps.in.outputs.split }}
          BACKEND: ${{ steps.in.outputs.backend }}
          CACHE: ${{ steps.in.outputs.cache }}
          MODEL: ${{ steps.in.outputs.model }}
          LIMIT: ${{ steps.in.outputs.limit }}
          THRESHOLD: ${{ steps.in.outputs.threshold }}
          FALLBACKS: ${{ steps.in.outputs.fallbacks }}
        run: |
          [[ "$SYSTEMS" =~ ^(agent|baseline)(,(agent|baseline))?$ ]] || { echo "systems must be agent and/or baseline"; exit 1; }
          [[ "$SPLIT" =~ ^(dev|test)$ ]] || { echo "split must be dev or test"; exit 1; }
          [[ "$BACKEND" =~ ^(groq|gemini)$ ]] || { echo "backend must be gemini or groq (free tiers)"; exit 1; }
          [[ "$CACHE" =~ ^(use|refresh)$ ]] || { echo "invalid cache mode"; exit 1; }
          [[ -z "$MODEL" || "$MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "invalid model id"; exit 1; }
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be an integer"; exit 1; }
          [[ "$FALLBACKS" =~ ^(auto|none)$ ]] || { echo "fallbacks must be auto or none"; exit 1; }
          [[ "$THRESHOLD" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]] || { echo "threshold must be in [0, 1]"; exit 1; }

      - name: Check the API key (its value is never printed)
        env:
          BACKEND: ${{ steps.in.outputs.backend }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "$BACKEND" in
            groq) var=GROQ_API_KEY ;;
            gemini) var=GEMINI_API_KEY ;;
          esac
          if [ -z "${!var}" ]; then
            echo "::error::Repository secret $var is not set. Add it under Settings > Secrets and variables > Actions, or pick another backend."
            exit 1
          fi
          echo "$var is set"

      - name: Download corpus-v2 and build the BM25 index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v2 --pattern documents.jsonl.gz --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
          rbirag index --chunker fixed

      - name: Run
        id: run
        env:
          SYSTEMS: ${{ steps.in.outputs.systems }}
          SPLIT: ${{ steps.in.outputs.split }}
          BACKEND: ${{ steps.in.outputs.backend }}
          MODEL: ${{ steps.in.outputs.model }}
          LIMIT: ${{ steps.in.outputs.limit }}
          FRESH: ${{ steps.in.outputs.fresh }}
          RBIRAG_COMPLIANCE_MODEL_FALLBACKS: ${{ steps.in.outputs.fallbacks }}
          RBIRAG_COMPLIANCE_ABSTAIN_THRESHOLD: ${{ steps.in.outputs.threshold }}
          RBIRAG_COMPLIANCE_LLM_CACHE_MODE: ${{ steps.in.outputs.cache }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          status=0
          for system in ${SYSTEMS//,/ }; do
            args=(comply eval run --system "$system" --split "$SPLIT" --backend "$BACKEND")
            [ -n "$MODEL" ] && args+=(--model "$MODEL")
            [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
            [ "$FRESH" = "true" ] && args+=(--fresh)
            rbirag "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          rbirag comply eval report --split "$SPLIT" \
            --documents data/processed/documents.jsonl \
            --out "results/compliance/results-$SPLIT.md" > /dev/null || true
          rbirag comply eval readme --documents data/processed/documents.jsonl || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit predictions, run records and recorded responses
        if: ${{ always() }}
        env:
          SYSTEMS: ${{ steps.in.outputs.systems }}
          SPLIT: ${{ steps.in.outputs.split }}
          BACKEND: ${{ steps.in.outputs.backend }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/compliance data/eval/compliance/llm_cache README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Compliance eval: $SYSTEMS on $SPLIT via $BACKEND (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::could not push results"; exit 1

      - name: Fail if a run stopped early
        if: ${{ steps.run.outputs.status != '0' }}
        run: |
          echo "::warning::A run stopped early (exit ${{ steps.run.outputs.status }}; 3 = provider quota). Re-dispatch to resume."
          exit 1
