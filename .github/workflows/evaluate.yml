name: Evaluate

# Retrieval ablation (no LLM) -> gate calibration + generation plan -> generation with the
# API provider's free tier (Groq by default, Gemini optional) and the local Ollama model
# -> LLM-judge + NLI -> report committed to results/. Every stage is resumable: re-run the workflow after the daily free-tier quota
# resets and it continues from the committed records and the cached LLM responses.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider for the API backend (free tiers)"
        type: choice
        options: [groq, gemini]
        default: groq
      generator_model:
        description: "API generator (blank = provider default: groq llama-3.1-8b-instant, gemini gemini-3.5-flash-lite)"
        type: string
        default: ""
      generator_fallbacks:
        description: "Comma-separated generator fallbacks (blank = provider default: groq openai/gpt-oss-20b)"
        type: string
        default: ""
      judge_model:
        description: "LLM judge (blank = provider default: groq llama-3.3-70b-versatile, gemini gemini-3.8-flash)"
        type: string
        default: ""
      judge_fallbacks:
        description: "Comma-separated judge fallbacks (blank = provider default: groq openai/gpt-oss-120b,qwen/qwen3-32b)"
        type: string
        default: ""
      ollama_model:
        description: "Local Ollama model evaluated alongside"
        type: string
        default: "qwen2.5:3b-instruct"
      requests_per_day:
        description: "Client-side daily request cap per model (0 = provider default)"
        type: string
        default: "0"
      reuse_retrieval:
        description: "Reuse committed retrieval results instead of re-running the ablation"
        type: boolean
        default: false
      full_configs:
        description: "Configs evaluated on the full test set"
        type: string
        default: "1"
      subset_configs:
        description: "Further configs evaluated on a subset"
        type: string
        default: "2"
      subset_size:
        description: "Answerable questions in the subset"
        type: string
        default: "50"

permissions:
  contents: write  # commits results/

concurrency:
  group: llm-quota-${{ inputs.provider }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  HF_HOME: ${{ github.workspace }}/.hf
  RBIRAG_EMBEDDER: sentence-transformers
  RBIRAG_RERANKER: cross-encoder
  RBIRAG_LLM_PROVIDER: ${{ inputs.provider }}
  RBIRAG_OAI_MODEL: ${{ inputs.generator_model }}
  RBIRAG_OAI_MODEL_FALLBACKS: ${{ inputs.generator_fallbacks || 'auto' }}
  RBIRAG_JUDGE_BACKEND: openai_compatible
  RBIRAG_JUDGE_MODEL: ${{ inputs.judge_model }}
  RBIRAG_JUDGE_MODEL_FALLBACKS: ${{ inputs.judge_fallbacks || 'auto' }}
  RBIRAG_OLLAMA_MODEL: ${{ inputs.ollama_model }}
  RBIRAG_LLM_RPD: ${{ inputs.requests_per_day }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provider-key
        with:
          provider: ${{ inputs.provider }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "true"
      - name: Check the test set exists
        run: |
          if [ ! -f data/eval/qa_v1.jsonl ] && [ ! -f data/eval/qa_candidates.jsonl ]; then
            echo "::error::No test set. Run the 'Generate Q/A candidates' workflow (and optionally 'rbirag eval verify') first."
            exit 1
          fi

  retrieval:
    needs: preflight
    if: ${{ !inputs.reuse_retrieval }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunker: [fixed, semantic, section]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,eval]"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Retrieval ablation (${{ matrix.chunker }} x 256/512/1024 x 4 modes)
        run: |
          rm -f results/retrieval/rows-${{ matrix.chunker }}.json results/retrieval/per_query-${{ matrix.chunker }}.jsonl
          rbirag eval retrieval --chunkers ${{ matrix.chunker }} --sizes 256,512,1024 --tag ${{ matrix.chunker }}
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ matrix.chunker }}
          path: results/retrieval/*-${{ matrix.chunker }}.*

  select:
    needs: [preflight, retrieval]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.retrieval.result == 'success' || needs.retrieval.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.plan.outputs.configs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[retrieval,eval]"
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_retrieval }}
        with:
          pattern: retrieval-*
          path: results/retrieval
          merge-multiple: true
      - name: Calibrate the confidence gate on the dev split
        run: rbirag eval calibrate
      - name: Plan generation and print the planned call count
        id: plan
        env:
          FULL: ${{ inputs.full_configs }}
          SUBSET: ${{ inputs.subset_configs }}
          SIZE: ${{ inputs.subset_size }}
        run: |
          rbirag eval plan --backends openai_compatible,ollama \
            --full-configs "$FULL" --subset-configs "$SUBSET" --subset-size "$SIZE" | tee /tmp/plan.txt
          { echo "## Generation plan"; echo '```'; cat /tmp/plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "configs=$(python -c "import json; p=json.load(open('results/generation/plan.json')); print(json.dumps(p['full']+p['subset']))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            results/calibration.json
            results/generation/plan.json

  generate-api:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provider-key
        with:
          provider: ${{ inputs.provider }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Restore LLM cache and quota counters
        uses: actions/cache/restore@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider }}-${{ github.run_id }}-api
          restore-keys: llm-cache-${{ inputs.provider }}-
      - name: Generate with the API provider and judge (resumable)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: rbirag eval generate --backend openai_compatible
      - name: Save LLM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider }}-${{ github.run_id }}-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-api
          path: results/generation/*openai_compatible*
          if-no-files-found: warn

  generate-ollama:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.select.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.ollama_model }}
      - name: Install and start Ollama
        env:
          MODEL: ${{ inputs.ollama_model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$MODEL"
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Generate with Ollama (judged later in one job to respect the API rate limit)
        run: rbirag eval generate --backend ollama --configs "${{ matrix.config }}" --no-judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-ollama-${{ strategy.job-index }}
          path: results/generation/*ollama*
          if-no-files-found: warn

  judge-ollama:
    needs: [select, generate-ollama, generate-api]
    # A failed API job (e.g. a fatal model/key error) stops everything downstream.
    if: ${{ always() && needs.select.result == 'success' && needs.generate-api.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provider-key
        with:
          provider: ${{ inputs.provider }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: generation-ollama-*
          path: results/generation
          merge-multiple: true
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Restore LLM cache and quota counters
        uses: actions/cache/restore@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider }}-${{ github.run_id }}-judge
          restore-keys: |
            llm-cache-${{ inputs.provider }}-${{ github.run_id }}-api
            llm-cache-${{ inputs.provider }}-
      - name: Judge the Ollama answers (generation is skipped because records exist)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: rbirag eval generate --backend ollama
      - name: Save LLM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider }}-${{ github.run_id }}-judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-ollama-judged
          path: results/generation/*ollama*
          if-no-files-found: warn

  report:
    needs: [preflight, retrieval, select, generate-api, judge-ollama]
    # Never report/commit a run whose LLM jobs failed (fatal configuration errors exit 2).
    # Quota exhaustion is not a failure: those jobs succeed with status "incomplete".
    if: ${{ always() && needs.select.result == 'success' && needs.generate-api.result == 'success' && needs.judge-ollama.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[retrieval,eval]"
      - name: Drop status files from earlier runs (only this run's count)
        run: rm -f results/generation/status-*.json
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_retrieval }}
        with:
          pattern: retrieval-*
          path: results/retrieval
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - uses: actions/download-artifact@v4
        with:
          name: generation-api
          path: results/generation
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: generation-ollama-judged
          path: results/generation
        continue-on-error: true
      - name: Build report
        run: |
          rbirag eval report
          {
            echo "## Status"
            for f in results/generation/status-*.json; do [ -f "$f" ] && { echo "### $f"; echo '```json'; cat "$f"; echo '```'; }; done
            cat results/README.md
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qs '"complete": false' results/generation/status-*.json; then
            echo "::warning::Generation is incomplete (free-tier quota). Re-run this workflow with reuse_retrieval=true after the quota resets."
          fi
      - name: Commit results (only if this run produced successful items)
        env:
          RETRIEVAL_FRESH: ${{ !inputs.reuse_retrieval }}
        run: |
          items=$(python3 - <<'PY'
          import glob, json, os
          n = 0
          for f in glob.glob("results/generation/status-*.json"):
              n += int(json.load(open(f)).get("successful_items", 0))
          if os.environ.get("RETRIEVAL_FRESH") == "true":
              for f in glob.glob("results/retrieval/rows-*.json"):
                  n += len(json.load(open(f)))
          print(n)
          PY
          )
          echo "successful items in this run: ${items}"
          if [ "${items}" -le 0 ]; then
            echo "::warning::This run produced no successful items; nothing is committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update evaluation results (run ${{ github.run_id }}, ${GITHUB_SHA::7})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
