name: Evaluate

# Retrieval ablation (no LLM) -> gate calibration + generation plan -> generation with the
# API provider's free tier (Groq by default, Gemini optional) and the local Ollama model
# (sharded) -> LLM-judge + NLI -> report published to results/. Every stage is resumable.
#
# Progress is never lost:
#  * every job checks out the latest main (not the queued run's SHA), so it resumes from
#    whatever earlier runs committed; retrieval is reused whenever rows are committed;
#  * generate/judge jobs stop cleanly before their time budget (RBIRAG_EVAL_DEADLINE) and
#    upload their records with if: always();
#  * scripts/publish_results.sh union-merges this run's records into the latest main,
#    regenerates every derived file from the merged records and retries the whole loop when
#    a push is rejected (no textual rebase of derived files).

on:
  # Hourly at :41 (the Q/A workflow runs daily at 09:41). A scheduled run only works once
  # the candidate set has reached its targets, resumes until every planned call is done,
  # and otherwise exits cleanly.
  schedule:
    - cron: "41 * * * *"  # hourly: resumes until done; exits early when done or quota is spent
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider for the API backend (free tiers)"
        type: choice
        options: [groq, gemini]
        default: groq
      generator_model:
        description: "API generator (blank = provider default: groq openai/gpt-oss-20b, gemini gemini-3.5-flash-lite)"
        type: string
        default: ""
      generator_fallbacks:
        description: "Comma-separated generator fallbacks (blank = provider default: groq qwen/qwen3.8-27b)"
        type: string
        default: ""
      judge_model:
        description: "LLM judge (blank = provider default: groq openai/gpt-oss-120b, gemini gemini-3.8-flash)"
        type: string
        default: ""
      judge_fallbacks:
        description: "Comma-separated judge fallbacks (blank = provider default: groq qwen/qwen3.8-27b)"
        type: string
        default: ""
      ollama_model:
        description: "Local Ollama model evaluated alongside"
        type: string
        default: "qwen2.5:3b-instruct"
      requests_per_day:
        description: "Client-side daily request cap per model (0 = provider default)"
        type: string
        default: "0"
      force_retrieval:
        description: "Re-run the retrieval ablation even if retrieval results are committed"
        type: boolean
        default: false
      budget_minutes:
        description: "Time budget per generate/judge job; they stop cleanly and publish before it"
        type: string
        default: "300"
      ollama_shards:
        description: "Parallel shards for each full-test-set Ollama config"
        type: string
        default: "4"
      full_configs:
        description: "Configs evaluated on the full test set"
        type: string
        default: "1"
      subset_configs:
        description: "Further configs evaluated on a subset"
        type: string
        default: "2"
      subset_size:
        description: "Answerable questions in the subset"
        type: string
        default: "50"

permissions:
  contents: write  # commits results/

# Scheduled runs have no inputs: every inputs.* reference falls back to its default.
# Runs on one provider key queue instead of overlapping (one pending run at most).
concurrency:
  group: llm-quota-${{ inputs.provider || 'groq' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  HF_HOME: ${{ github.workspace }}/.hf
  RBIRAG_EMBEDDER: sentence-transformers
  RBIRAG_RERANKER: cross-encoder
  RBIRAG_LLM_PROVIDER: ${{ inputs.provider || 'groq' }}
  RBIRAG_OAI_MODEL: ${{ inputs.generator_model || '' }}
  RBIRAG_OAI_MODEL_FALLBACKS: ${{ inputs.generator_fallbacks || 'auto' }}
  RBIRAG_JUDGE_BACKEND: openai_compatible
  RBIRAG_JUDGE_MODEL: ${{ inputs.judge_model || '' }}
  RBIRAG_JUDGE_MODEL_FALLBACKS: ${{ inputs.judge_fallbacks || 'auto' }}
  RBIRAG_OLLAMA_MODEL: ${{ inputs.ollama_model || 'qwen2.5:3b-instruct' }}
  RBIRAG_LLM_RPD: ${{ inputs.requests_per_day || '0' }}
  BUDGET_MINUTES: ${{ inputs.budget_minutes || '300' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reuse: ${{ steps.gate.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[retrieval]"
      - name: Decide whether this run has work to do
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          FORCE_RETRIEVAL: ${{ inputs.force_retrieval || false }}
        run: |
          # Retrieval has no LLM cost but takes hours: reuse committed rows on every event
          # unless explicitly forced.
          if [ "$FORCE_RETRIEVAL" != "true" ] && ls results/retrieval/rows-*.json >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f data/eval/qa_v1.jsonl ] && [ ! -f data/eval/qa_candidates.jsonl ]; then
            if [ "$EVENT" = "schedule" ]; then
              echo "No test set yet; nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::No test set. Run the 'Generate Q/A candidates' workflow (and optionally 'rbirag eval verify') first."
            exit 1
          fi
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rbirag eval qa-status | tee /tmp/qa_status.json
          met=$(python -c "import json; print(json.load(open('/tmp/qa_status.json'))['targets_met'])")
          if [ "$met" != "True" ]; then
            echo "Candidate targets not reached yet; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rbirag eval progress | tee /tmp/progress.json
          done_=$(python -c "import json; print(json.load(open('/tmp/progress.json'))['done'])")
          if [ "$done_" = "True" ]; then
            echo "All planned generation and judge calls are done; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/provider-key
        if: steps.gate.outputs.run == 'true'
        with:
          provider: ${{ inputs.provider || 'groq' }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "true"

  retrieval:
    needs: preflight
    if: ${{ needs.preflight.outputs.run == 'true' && needs.preflight.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunker: [fixed, semantic, section]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,eval]"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Retrieval ablation (${{ matrix.chunker }} x 256/512/1024 x 4 modes)
        run: |
          rm -f results/retrieval/rows-${{ matrix.chunker }}.json results/retrieval/per_query-${{ matrix.chunker }}.jsonl
          rbirag eval retrieval --chunkers ${{ matrix.chunker }} --sizes 256,512,1024 --tag ${{ matrix.chunker }}
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-${{ matrix.chunker }}
          path: results/retrieval/*-${{ matrix.chunker }}.*

  select:
    needs: [preflight, retrieval]
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.run == 'true' && (needs.retrieval.result == 'success' || needs.retrieval.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      ollama_matrix: ${{ steps.plan.outputs.ollama_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[retrieval,eval]"
      - uses: actions/download-artifact@v4
        if: ${{ needs.preflight.outputs.reuse != 'true' }}
        with:
          pattern: retrieval-*
          path: results/retrieval
          merge-multiple: true
      - name: Calibrate the confidence gate on the dev split
        run: rbirag eval calibrate
      - name: Plan generation and print the planned call count
        id: plan
        env:
          FULL: ${{ inputs.full_configs || '1' }}
          SUBSET: ${{ inputs.subset_configs || '2' }}
          SIZE: ${{ inputs.subset_size || '50' }}
          SHARDS: ${{ inputs.ollama_shards || '4' }}
        run: |
          rbirag eval plan --backends openai_compatible,ollama \
            --full-configs "$FULL" --subset-configs "$SUBSET" --subset-size "$SIZE" | tee /tmp/plan.txt
          { echo "## Generation plan"; echo '```'; cat /tmp/plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Ollama runs on CPU: split each full-test-set config into shards (stable hash of
          # the question id), subset configs run as one job each.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.load(open("results/generation/plan.json"))
          n = max(1, int(os.environ["SHARDS"]))
          inc = [{"config": c, "shard": f"{i}/{n}"} for c in p["full"] for i in range(1, n + 1)]
          inc += [{"config": c, "shard": "1/1"} for c in p["subset"]]
          print("ollama_matrix=" + json.dumps({"include": inc}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            results/calibration.json
            results/generation/plan.json

  generate-api:
    needs: select
    # always(): run even when retrieval was skipped because its rows are reused.
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Start the time budget
        run: echo "RBIRAG_EVAL_DEADLINE=$(( $(date +%s) + BUDGET_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/provider-key
        with:
          provider: ${{ inputs.provider || 'groq' }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Restore LLM cache and quota counters
        uses: actions/cache/restore@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}-api
          restore-keys: llm-cache-${{ inputs.provider || 'groq' }}-
      - name: Generate with the API provider and judge (resumes from committed records)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: rbirag eval generate --backend openai_compatible
      - name: Save LLM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}-api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-api
          path: |
            results/generation/records-openai_compatible-*.jsonl
            results/generation/status-openai_compatible*.json
            results/generation/fatal-*.json
          if-no-files-found: warn
          retention-days: 14

  generate-ollama:
    needs: select
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.ollama_matrix) }}
    steps:
      - name: Start the time budget
        run: echo "RBIRAG_EVAL_DEADLINE=$(( $(date +%s) + BUDGET_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.ollama_model || 'qwen2.5:3b-instruct' }}
      - name: Install and start Ollama
        env:
          MODEL: ${{ inputs.ollama_model || 'qwen2.5:3b-instruct' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$MODEL"
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Generate with Ollama, shard ${{ matrix.shard }} (judged later to respect the API rate limit)
        run: rbirag eval generate --backend ollama --configs "${{ matrix.config }}" --shard "${{ matrix.shard }}" --no-judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-ollama-${{ strategy.job-index }}
          path: |
            results/generation/records-ollama-*.jsonl
            results/generation/status-ollama*.json
            results/generation/fatal-*.json
          if-no-files-found: warn
          retention-days: 14

  judge:
    needs: [select, generate-ollama, generate-api]
    # Judges every answer that has no verdict yet, API and Ollama, until the judge's daily
    # quota or the time budget runs out (judge-only: never generates, needs no Ollama).
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Start the time budget
        run: echo "RBIRAG_EVAL_DEADLINE=$(( $(date +%s) + BUDGET_MINUTES * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/provider-key
        with:
          provider: ${{ inputs.provider || 'groq' }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "false"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,retrieval,ml,llm,eval]"
      - uses: actions/cache@v4
        with:
          path: .hf
          key: hf-models-v1-${{ runner.os }}
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: results
      - name: This run's answers (one directory per job)
        uses: actions/download-artifact@v4
        with:
          pattern: generation-*
          path: /tmp/run/generation
        continue-on-error: true
      - name: Merge them into the committed records
        run: |
          mkdir -p /tmp/run/generation
          rbirag eval merge-records --incoming /tmp/run/generation --into results/generation
      - name: Download corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
      - name: Restore LLM cache and quota counters
        uses: actions/cache/restore@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}-judge
          restore-keys: |
            llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}-api
            llm-cache-${{ inputs.provider || 'groq' }}-
      - name: Judge new answers (API, then Ollama)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rbirag eval generate --backend openai_compatible --judge-only
          rbirag eval generate --backend ollama --judge-only
      - name: Save LLM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}-judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-judged
          path: |
            results/generation/records-*.jsonl
            results/generation/status-*.judge.json
            results/generation/fatal-*.json
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [preflight, retrieval, select, generate-api, generate-ollama, judge]
    # Publishes whatever succeeded, even if a job failed or ran out of time. A fatal
    # configuration error (exit 2) leaves a fatal-*.json marker and blocks publishing.
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[retrieval,eval]"
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /tmp/run/plan
      - uses: actions/download-artifact@v4
        if: ${{ needs.preflight.outputs.reuse != 'true' }}
        with:
          pattern: retrieval-*
          path: /tmp/run/retrieval
          merge-multiple: true
      - name: Every generate/judge artifact (one directory each)
        uses: actions/download-artifact@v4
        with:
          pattern: generation-*
          path: /tmp/run/generation
        continue-on-error: true
      - name: Merge onto the latest main, regenerate derived files, push (retries)
        env:
          PUBLISH_MESSAGE: "Update evaluation results (run ${{ github.run_id }})"
        run: scripts/publish_results.sh /tmp/run
      - name: Summary
        if: always()
        run: |
          {
            echo "## Status"
            for f in results/generation/status-*.json; do [ -f "$f" ] && { echo "### $f"; echo '```json'; cat "$f"; echo '```'; }; done
            [ -f results/README.md ] && cat results/README.md
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qs '"complete": false' results/generation/status-*.json; then
            echo "::warning::Generation is incomplete (free-tier quota or time budget); the next scheduled run resumes."
          fi
