name: Generate Q/A candidates

on:
  # Daily, to use each day's free-tier token slice. 09:41 UTC is offset from the jobpost
  # repository's 03:23 UTC run so the shared key is never used concurrently.
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      n_answerable:
        description: "Answerable candidates to generate (stratified by year x department)"
        type: string
        default: "220"
      n_unanswerable:
        description: "Unanswerable candidates"
        type: string
        default: "30"
      provider:
        description: "LLM provider for the API backend (free tiers)"
        type: choice
        options: [groq, gemini]
        default: groq
      model:
        description: "Q/A writer model (blank = provider default: groq openai/gpt-oss-120b, gemini gemini-3.8-flash)"
        type: string
        default: ""
      model_fallbacks:
        description: "Comma-separated fallbacks (blank = provider default: groq qwen/qwen3.8-27b)"
        type: string
        default: ""
      requests_per_day:
        description: "Client-side daily request cap per model (0 = provider default)"
        type: string
        default: "0"

permissions:
  contents: write  # commits data/eval/qa_candidates.jsonl

# Scheduled runs have no inputs: every inputs.* reference falls back to its default.
concurrency:
  group: llm-quota-${{ inputs.provider || 'groq' }}  # one run at a time per provider quota (shared with evaluate.yml)
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PROVIDER: ${{ inputs.provider || 'groq' }}
  N_ANS: ${{ inputs.n_answerable || '220' }}
  N_UNANS: ${{ inputs.n_unanswerable || '30' }}
  RBIRAG_LLM_PROVIDER: ${{ inputs.provider || 'groq' }}
  RBIRAG_QA_BACKEND: openai_compatible
  RBIRAG_QA_MODEL: ${{ inputs.model || '' }}
  RBIRAG_QA_MODEL_FALLBACKS: ${{ inputs.model_fallbacks || 'auto' }}
  RBIRAG_LLM_RPD: ${{ inputs.requests_per_day || '0' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm]"

      - name: Are the candidate targets already met?
        id: gate
        run: |
          rbirag eval qa-status --n-answerable "$N_ANS" --n-unanswerable "$N_UNANS" | tee /tmp/qa_status.json
          met=$(python -c "import json; print(str(json.load(open('/tmp/qa_status.json'))['targets_met']).lower())")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$met" = "true" ]; then
            echo "Targets met; nothing to do on this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/provider-key
        if: steps.gate.outputs.skip != 'true'
        with:
          provider: ${{ inputs.provider || 'groq' }}
          groq_key: ${{ secrets.GROQ_API_KEY }}
          gemini_key: ${{ secrets.GEMINI_API_KEY }}
          list_models: "true"

      - name: Download corpus (release corpus-v1)
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v1 --pattern 'documents.jsonl.gz' --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
          echo "documents: $(wc -l < data/processed/documents.jsonl)"

      - name: Restore LLM response cache and quota counters
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}
          restore-keys: llm-cache-${{ inputs.provider || 'groq' }}-

      - name: Build the chunk store (section-aware, 512 tokens, no embeddings)
        if: steps.gate.outputs.skip != 'true'
        run: rbirag index --chunker section --no-dense

      - name: Generate candidates (resumable; stops cleanly when the daily quota is used)
        if: steps.gate.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          rbirag eval qa-generate --chunks indexes/section/chunks.jsonl \
            --n-answerable "$N_ANS" --n-unanswerable "$N_UNANS" --stats-out /tmp/qa_stats.json
          status=$?
          set -e
          {
            echo "## Q/A candidates"
            if [ -f /tmp/qa_stats.json ]; then echo '```json'; cat /tmp/qa_stats.json; echo '```'; fi
            [ "$status" -eq 2 ] && echo "**Fatal configuration error** (see log); nothing is committed."
            [ "$status" -eq 3 ] && echo "**No Q/A pairs were produced**; nothing is committed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/qa_stats.json ] && grep -q '"complete": false' /tmp/qa_stats.json; then
            echo "::warning::Stopped early (quota or provider errors). Re-run later; finished pairs and cached responses are reused."
          fi
          exit "$status"

      - name: Save LLM cache
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ inputs.provider || 'groq' }}-${{ github.run_id }}

      - name: Commit candidates (only when this run produced new pairs)
        # Runs even if generation stopped early, so partial progress is kept; skipped
        # cleanly when there is nothing new (no stats file = fatal error or crash).
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ ! -f /tmp/qa_stats.json ]; then echo "no stats from this run; nothing to commit"; exit 0; fi
          new_items=$(python -c "import json; print(json.load(open('/tmp/qa_stats.json'))['new_items'])")
          if [ "$new_items" -le 0 ] || [ ! -f data/eval/qa_candidates.jsonl ]; then
            echo "no new Q/A pairs; nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/eval/qa_candidates.jsonl
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update Q/A candidates: +${new_items} (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
