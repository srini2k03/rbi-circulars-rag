name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (light extras only, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm,eval,api,dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest (browser tests run in the web job)
        run: pytest -m "not browser" --cov --cov-report=term-missing:skip-covered

      - name: Assert heavy ML deps were not needed
        run: |
          python - <<'PY'
          import importlib.util, sys
          heavy = [m for m in ("torch", "sentence_transformers") if importlib.util.find_spec(m)]
          sys.exit(f"heavy deps unexpectedly installed: {heavy}" if heavy else 0)
          PY

      - name: Offline end-to-end smoke on fixtures
        run: ./scripts/smoke_fixtures.sh

  web:
    name: static site (Node parity + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm,dev,web-test]"
          python -m playwright install --with-deps chromium
      - name: JS/Python parity and browser end-to-end tests
        env:
          RBIRAG_REQUIRE_BROWSER: "1"
        run: pytest tests/test_web_js.py tests/test_web_export.py tests/test_web_browser.py -v

  docker-smoke:
    name: docker compose smoke (fake LLM, fixture index)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker/compose.smoke.yml build api ui
      - name: Start qdrant, api, ui
        run: docker compose -f docker-compose.yml -f docker/compose.smoke.yml up -d qdrant api ui
      - name: Wait for the API to load the fixture index
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | tee /tmp/health.json | grep -q '"status":"ok"'; then break; fi
            sleep 3
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Smoke /health, /query, /query/stream, /metrics and the UI
        run: |
          curl -fsS -X POST http://localhost:8000/query -H 'content-type: application/json' \
            -d '{"question": "How often is periodic updation of KYC for high risk customers?"}' | tee /tmp/q.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/q.json"))
          assert not r["refused"], r
          assert r["citations"] and r["citations"][0]["doc_id"] == "rbi-12655", r["citations"]
          assert r["citations"][0]["url"].startswith("https://www.rbi.org.in/"), r["citations"][0]
          assert set(r["timings_ms"]) >= {"retrieve", "rerank", "generate", "total"}
          print("query OK:", r["answer"][:80])
          PY
          curl -fsSN -X POST http://localhost:8000/query/stream -H 'content-type: application/json' \
            -d '{"question": "How often is periodic updation of KYC for high risk customers?"}' | tee /tmp/s.txt
          grep -q '^event: sources' /tmp/s.txt
          grep -q '^event: token' /tmp/s.txt
          grep -q '^event: done' /tmp/s.txt
          curl -fsS http://localhost:8000/metrics | tee /tmp/m.json
          python3 -c "import json; m=json.load(open('/tmp/m.json')); assert m['requests'] == 2, m"
          for i in $(seq 1 30); do curl -fsS http://localhost:8501/_stcore/health && break; sleep 2; done
      - name: Logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker/compose.smoke.yml logs --no-color api ui | tail -200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker/compose.smoke.yml down -v
