name: Compliance CI

# On every push (any branch) and pull request: the compliance tests, the labelled set
# checked against corpus-v2, and a replay of every recorded evaluation run from the
# committed LLM responses. The replay makes no provider calls and needs no API key; it
# fails if a prediction changes (regression) or if code / prompt changes mean a recorded
# request no longer matches (then re-run compliance-eval.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  RBIRAG_EMBEDDER: fake
  RBIRAG_RERANKER: none
  RBIRAG_COMPLIANCE_LLM_CACHE_DIR: data/eval/compliance/llm_cache

jobs:
  tests:
    name: compliance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm,eval,api,dev]"
      - run: ruff check src/rbirag/compliance tests/test_compliance_*.py
      - run: mypy
      - run: pytest tests/test_compliance_*.py -q

  gold:
    name: labels vs corpus-v2 (quotes, citations, segmentation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest]"
      - name: Download corpus-v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download corpus-v2 --pattern documents.jsonl.gz --dir /tmp/corpus
          gunzip /tmp/corpus/documents.jsonl.gz
      - name: Every citation exists and every evidence quote is verbatim
        run: rbirag comply eval check --documents /tmp/corpus/documents.jsonl --out /tmp/gold_check.json
      - name: Committed gold check is current
        run: |
          python - <<'PY'
          import json
          fresh = json.load(open("/tmp/gold_check.json"))
          committed = json.load(open("results/compliance/gold_check.json"))
          assert fresh == committed, "re-run: rbirag comply eval check --out results/compliance/gold_check.json"
          PY
      - name: Clause segmentation (text and PDF)
        run: rbirag comply eval segmentation

  replay:
    name: replay recorded eval runs (no provider calls)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,retrieval,llm,eval]"
      - name: Any recorded runs?
        id: runs
        run: |
          if ls results/compliance/runs/*.json >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no recorded runs yet"; fi
      - name: Download corpus-v2 and build the BM25 index
        if: steps.runs.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/processed
          gh release download corpus-v2 --pattern documents.jsonl.gz --dir /tmp/corpus
          gunzip -c /tmp/corpus/documents.jsonl.gz > data/processed/documents.jsonl
          rbirag index --chunker fixed
      - name: Replay every recorded run and compare predictions
        if: steps.runs.outputs.present == 'true'
        run: |
          set +e
          rbirag comply eval replay | tee replay.txt
          status=${PIPESTATUS[0]}
          cat replay.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo "::error::Recorded LLM requests no longer match (prompts, tools or retrieval changed). Re-run compliance-eval.yml to record new responses."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Replayed predictions differ from the recorded ones (regression)."
          fi
          exit "$status"
      - name: README results section is current
        if: steps.runs.outputs.present == 'true'
        run: rbirag comply eval readme --check --documents data/processed/documents.jsonl
      - name: Metrics from the recorded runs
        if: steps.runs.outputs.present == 'true'
        run: |
          for split in dev test; do
            if ls results/compliance/runs/*-"$split"-*.json >/dev/null 2>&1; then
              rbirag comply eval report --split "$split" --documents data/processed/documents.jsonl >> "$GITHUB_STEP_SUMMARY"
            fi
          done
