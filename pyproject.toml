[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rbi-circulars-rag"
version = "0.1.0"
description = "Hybrid-retrieval RAG over Reserve Bank of India notifications, with citations and a confidence gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Srinivasan Balasubramanian" }]
keywords = ["rag", "retrieval", "bm25", "qdrant", "rbi", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
# Core deps are deliberately tiny; everything else lives in extras so CI stays light.
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
# Fetching + parsing the RBI corpus.
ingest = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pymupdf>=1.24",
]
# Sparse + dense indexes (no torch).
retrieval = [
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.10",
]
# Real embedding / reranking models. Heavy (torch); never needed by the test-suite.
ml = [
  "sentence-transformers>=3.0",
]
# Optional BPE tokenizer for the fixed-size chunker (downloads its vocabulary on first use).
tiktoken = [
  "tiktoken>=0.7",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
rbirag = "rbirag.cli:app"

[project.urls]
Repository = "https://github.com/srini2k03/rbi-circulars-rag"

[tool.hatch.build.targets.wheel]
packages = ["src/rbirag"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PTH", "PL", "TID", "ARG", "PT",
]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "PLC0415",  # lazy imports are intentional (heavy optional deps)
  "PLR0917",  # typer commands take many options
  "PLW2901",  # re-binding a loop variable after trimming is clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["rbirag"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["rbirag"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "sentence_transformers.*", "tiktoken", "fitz", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: needs internet access (deselected in CI)",
]
filterwarnings = [
  "error::DeprecationWarning:rbirag.*",
]

[tool.coverage.run]
source = ["rbirag"]
branch = true
